<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choisir une liste de cadeaux</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #f6f6f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
    }

    h1 {
        font-size: 2.2rem;
        font-weight: 700;
        color: #333;
        text-align: center;
        margin-bottom: 30px;
    }

    .menu-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
        max-width: 900px;
        width: 100%;
    }

    /* --- CARTE AUDRICK --- */
    .card-audrick {
        background: linear-gradient(145deg, #8f1e2f, #aa2538);
        width: 320px;
        border-radius: 18px;
        padding: 30px;
        color: white;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: 0.2s ease;
    }
    .card-audrick:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 18px rgba(0,0,0,0.25);
    }

    /* --- CARTE MARION --- */
    .card-marion {
        background: linear-gradient(145deg, #e96190, #ff70a3);
        width: 320px;
        border-radius: 18px;
        padding: 30px;
        color: white;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: 0.2s ease;
    }
    .card-marion:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 18px rgba(0,0,0,0.25);
    }

    .gift-icon {
        font-size: 45px;
        margin-bottom: 15px;
    }

    h2 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
    }

    p {
        margin-top: 10px;
        margin-bottom: 20px;
        opacity: 0.9;
    }

    .btn {
        display: inline-block;
        padding: 12px 22px;
        background: white;
        color: #333;
        font-weight: 600;
        border-radius: 50px;
        text-decoration: none;
        transition: 0.2s ease;
    }

    .card-audrick .btn { color: #8f1e2f; }
    .card-marion .btn { color: #e96190; }

    .btn:hover {
        transform: scale(1.05);
    }

</style>
</head>

<body>

<h1>🎁 Choisissez une liste de cadeaux 🎁</h1>

<div class="menu-container">

    <!-- AUDRICK -->
    <div class="card-audrick" onclick="location.href='/audrick/'">
        <div class="gift-icon">🎁</div>
        <h2>Liste d'Audrick</h2>
        <!--<p>La liste rouge bordeaux, parfaite pour me faire plaisir !</p>  -->
        <a class="btn" href="/audrick/">Voir la liste</a>
    </div>

    <!-- MARION -->
    <div class="card-marion" onclick="location.href='/marion/'">
        <div class="gift-icon">🎁</div>
        <h2>Liste de Marion</h2>
        <!--<p>La liste rose, remplie de jolies idées pour elle.</p> -->
        <a class="btn" href="/marion/">Voir la liste</a>
    </div>

</div>

</body>
</html>
